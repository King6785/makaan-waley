<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- MAKAAN WALEY Logo - Based on WeHouse style with custom branding -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22b8d4"/>
      <stop offset="100%" style="stop-color:#c53030"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Building/House -->
  <g transform="translate(10, 5)">
    <!-- House base -->
    <path d="M5 35 L5 15 L15 5 L25 15 L25 35 Z" fill="url(#logoGradient)" opacity="0.9"/>
    <!-- Roof -->
    <path d="M0 20 L15 0 L30 20 Z" fill="#c53030" opacity="0.8"/>
    <!-- Window -->
    <rect x="10" y="22" width="10" height="10" rx="1" fill="#ffffff" opacity="0.9"/>
    <!-- Door -->
    <rect x="18" y="28" width="5" height="7" rx="0.5" fill="#0f172a"/>
  </g>
  
  <!-- Text: MAKAAN WALEY -->
  <text x="50" y="38" font-family="Space Grotesk, Outfit, sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="-0.5">
    MAKAAN WALEY
  </text>
  
  <!-- Tagline -->
  <text x="50" y="52" font-family="Outfit, sans-serif" font-size="10" font-weight="500" fill="#67e8f9" letter-spacing="2" text-transform="uppercase">
    TECH-POWERED CONSTRUCTION
  </text>
</svg>